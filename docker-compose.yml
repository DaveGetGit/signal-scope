services:
  app-dev:
    profiles: ["dev"]
    build:
      context: .
      target: deps
    command: sh -lc "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  app-test:
    profiles: ["test"]
    build:
      context: .
      target: deps
    command: sh -lc "if [ ! -x node_modules/.bin/vitest ]; then npm ci; fi && npm run test"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  app-lint:
    profiles: ["lint"]
    build:
      context: .
      target: deps
    command: sh -lc "if [ ! -x node_modules/.bin/eslint ]; then npm ci; fi && npm run lint && npm run type-check"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  app-prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
    ports:
      - "8080:80"

volumes:
  node_modules:
